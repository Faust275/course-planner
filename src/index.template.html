<body>

<div class="app-bg" id="appBg"></div>

<div class="app">
  <!-- 侧边栏（桌面端） -->
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <div class="brand-logo">课</div>
      <div class="brand-text">
        <strong>Course Planner</strong>
        <span id="brandSub">我的课程表</span>
      </div>
    </div>

    <nav class="nav" id="nav"></nav>

    <div class="sidebar-foot">
      <div class="term-card" id="termCard"></div>
    </div>
  </aside>

  <!-- 主内容区 -->
  <main class="main">
    <header class="topbar">
      <h1 class="topbar-title" id="viewTitle">课程表</h1>
      <div class="topbar-actions" id="viewActions"></div>
    </header>

    <div class="view-wrap" id="views"></div>
  </main>

  <!-- 底部导航（移动端） -->
  <nav class="tabbar mobile-only" id="tabbar"></nav>
</div>

<!-- 遮罩 -->
<div class="scrim" id="scrim"></div>

<!-- 通用弹窗容器 -->
<div class="modal-root" id="modalRoot"></div>

<!-- 轻提示 -->
<div class="toast-root" id="toastRoot"></div>
