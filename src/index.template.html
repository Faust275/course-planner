<!DOCTYPE html>
<html lang="zh-CN">
<head>

<meta charset="UTF-8">
<meta content="width=device-width, initial-scale=1, viewport-fit=cover" name="viewport">
<meta content="#4f46e5" name="theme-color">
<meta content="课程表与日程、计划、记账、专注的一体化个人管理工具" name="description">
<meta content="yes" name="apple-mobile-web-app-capable">
<meta content="yes" name="mobile-web-app-capable">
<meta content="default" name="apple-mobile-web-app-status-bar-style">
<meta content="课表" name="apple-mobile-web-app-title">
<meta content="telephone=no" name="format-detection">
<link href="icon-192.png" rel="icon">
<link href="apple-touch-icon.png" rel="apple-touch-icon">
<title>课表 Course Planner</title>
</head>
<body>

<div class="cp-app-bg" id="appBg"></div>

<div class="cp-app">
  <!-- 侧边栏（桌面端） -->
  <aside class="cp-sidebar" id="sidebar">
    <div class="cp-brand">
      <div class="cp-brand-logo">课</div>
      <div class="cp-brand-text">
        <strong>Course Planner</strong>
        <span id="brandSub">我的课程表</span>
      </div>
    </div>

    <nav class="cp-nav" id="nav"></nav>

    <div class="cp-sidebar-foot">
      <div class="cp-term-card" id="termCard"></div>
    </div>
  </aside>

  <!-- 主内容区 -->
  <main class="cp-main">
    <header class="cp-topbar">
      <button class="cp-icon-btn cp-desk-only" id="btnCollapse" aria-label="折叠侧边栏" title="折叠侧边栏" style="margin-right:8px;flex:0 0 auto">
        <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4.5" width="18" height="15" rx="2.4"/><path d="M9.2 4.5v15"/><path d="M15.4 9.6L13 12l2.4 2.4"/></svg>
      </button>
      <h1 class="cp-topbar-title" id="viewTitle">课程表</h1>
      <div class="cp-topbar-actions" id="viewActions"></div>
      <button class="cp-icon-btn" id="btnSearch" aria-label="搜索" title="搜索（Ctrl/⌘ + K）" style="margin-left:6px;flex:0 0 auto">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
      </button>
    </header>

    <div class="cp-view-wrap" id="views"></div>
  </main>

  <!-- 底部导航（移动端） -->
  <nav class="cp-tabbar cp-mobile-only" id="tabbar"></nav>
</div>

<!-- 遮罩 -->
<div class="cp-scrim" id="scrim"></div>

<!-- 通用弹窗容器 -->
<div class="cp-modal-root" id="modalRoot"></div>

<!-- 轻提示 -->
<div class="cp-toast-root" id="toastRoot"></div>

<link rel="stylesheet" href="assets/css/style.css">
<script src="assets/js/ak_ops.js"></script>
<script src="assets/js/lunar.js"></script>
<script src="assets/js/palette.js"></script>
<script src="assets/js/course-exception.js"></script>
<script src="assets/js/stats-calc.js"></script>
<script src="assets/js/store.js"></script>
<script src="assets/js/ui.js"></script>
<script src="assets/js/router.js"></script>
<script src="assets/js/remind.js"></script>
<script src="assets/js/search.js"></script>
<script src="assets/js/views/schedule.js"></script>
<script src="assets/js/schedule-export.js"></script>
<script src="assets/js/views/today.js"></script>
<script src="assets/js/views/calendar.js"></script>
<script src="assets/js/views/agenda.js"></script>
<script src="assets/js/views/quadrant.js"></script>
<script src="assets/js/views/stats.js"></script>
<script src="assets/js/views/tasks.js"></script>
<script src="assets/js/views/goals.js"></script>
<script src="assets/js/views/plans.js"></script>
<script src="assets/js/views/ocr-dialog.js"></script>
<script src="assets/js/views/notes.js"></script>
<script src="assets/js/views/diary.js"></script>
<script src="assets/js/views/ledger.js"></script>
<script src="assets/js/views/gacha.js"></script>
<script src="assets/js/views/pomodoro.js"></script>
<script src="assets/js/views/collection.js"></script>
<script src="assets/js/views/grades.js"></script>
<script src="assets/js/views/settings.js"></script>
<script src="assets/js/quotes-data.js"></script>
<script src="assets/js/foods.js"></script>
<script src="assets/js/quotes.js"></script>
<script src="assets/js/speech.js"></script>
<script src="assets/js/ocr.js"></script>
<script src="assets/js/theme.js"></script>
<script src="assets/js/onboard.js"></script>
<script src="assets/js/pet.js"></script>
<script src="assets/js/app.js"></script>
</body>
</html>
