name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  lint-test:
    name: Lint + Unit + OCR Bench + Build & Sync Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install --no-audit --no-fund
      - name: Lint (ESLint)
        run: npm run lint
      - name: Unit & Contract tests
        run: npm test
      - name: OCR Benchmark
        run: npm run bench:ocr
      - name: Build & Sync Android Assets (index.html + quotes-data.js + sw.js + dist/ + android/)
        run: |
          npm run build:sync
          cmp -s index.html dist/index.html
          cmp -s index.html android/app/src/main/assets/public/index.html
          cmp -s sw.js dist/sw.js
          cmp -s sw.js android/app/src/main/assets/public/sw.js

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    needs: lint-test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Build
        run: npm run build
      - name: Run e2e (verify_*.mjs)
        run: npm run e2e
