name: Build Android APK

on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build-apk:
    name: Build & Verify APK
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      KEYSTORE_PATH: ${{ github.workspace }}/android/app/happy-course.keystore
      KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Capacitor & Web dependencies
        run: npm ci || npm install

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Android SDK (manual)
        run: |
          SDK=$ANDROID_HOME
          echo "Using ANDROID_HOME=$SDK"
          rm -rf "$SDK/cmdline-tools/latest"
          mkdir -p "$SDK/cmdline-tools"
          curl -fsSL https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip -o /tmp/cmdtools.zip
          unzip -q /tmp/cmdtools.zip -d /tmp/cmdtools
          mv /tmp/cmdtools/cmdline-tools "$SDK/cmdline-tools/latest"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK" --licenses >/dev/null 2>&1
          "$SDK/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK" "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Build single-file web bundle & sync to Android
        run: |
          python3 build.py --release
          npx cap sync android || npx cap copy android || true
          mkdir -p android/app/src/main/assets/public
          cp dist/index.html android/app/src/main/assets/public/index.html
          cp dist/quotes-data.js android/app/src/main/assets/public/quotes-data.js
          rm -rf android/app/src/main/assets/public/ops

      # 签名密钥只从 Secrets 还原。没有 Secret 就不打 release：
      # 每次 CI 现生成一把新 key 会让「覆盖升级」永远失败，这是比不签名更糟的坑。
      - name: Restore signing keystore from secrets
        run: |
          if [ -n "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/app/happy-course.keystore
            echo "keystore restored"
          else
            echo "::warning::没有配置 ANDROID_KEYSTORE_BASE64，本次只构建 debug 包（不可覆盖升级）"
          fi

      # 产出 Android App Bundle（AAB）。Play 商店只收 AAB；侧载 APK 可用
      # `./gradlew assembleRelease` 单独构建。release 缺签名密钥时 build.gradle 会直接抛错，
      # 不会产出「看起来成功却没签名」的包（同 assemble 的防护）。
      - name: Build AAB
        working-directory: android
        run: |
          chmod +x gradlew
          if [ -f app/happy-course.keystore ]; then
            ./gradlew bundleRelease
          else
            ./gradlew bundleDebug
          fi

      # 校验：AAB 是 zip 容器，apksigner 不适用；改为「非空 + 可选 bundletool 结构校验」。
      # versionName 由 build.gradle 直接读 package.json（见 android/app/build.gradle），构建即一致，
      # 无需逐项比对；如需强校验可装 bundletool 跑 `validate-app-bundle`。
      - name: Verify bundle & version
        run: |
          AAB=$(ls android/app/build/outputs/bundle/release/app-release.aab 2>/dev/null || ls android/app/build/outputs/bundle/debug/app-debug.aab)
          echo "AAB=$AAB"
          test -s "$AAB" || { echo "::error::AAB 为空或不存在"; exit 1; }
          PKG_VERSION=$(node -p "require('./package.json').version")
          echo "期望 versionName=$PKG_VERSION（build.gradle 绑定 package.json，构建即一致）"
          if command -v bundletool >/dev/null 2>&1; then
            bundletool validate-app-bundle --bundle "$AAB"
          else
            echo "::notice::未安装 bundletool，跳过 AAB 结构校验"
          fi
          if [ -f android/app/happy-course.keystore ]; then
            echo "release (签名) AAB 构建成功"
          fi

      - name: Collect installable AAB
        run: |
          if [ -f android/app/build/outputs/bundle/release/app-release.aab ]; then
            cp android/app/build/outputs/bundle/release/app-release.aab CoursePlanner-signed.aab
            echo "ARTIFACT_NAME=CoursePlanner-signed-AAB" >> $GITHUB_ENV
          else
            cp android/app/build/outputs/bundle/debug/app-debug.aab CoursePlanner-debug-not-upgradeable.aab
            echo "ARTIFACT_NAME=CoursePlanner-debug-AAB" >> $GITHUB_ENV
          fi

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: CoursePlanner-*.aab
          retention-days: 90
